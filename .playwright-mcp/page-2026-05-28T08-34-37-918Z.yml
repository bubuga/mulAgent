          - paragraph [ref=e744]: 每一行代码都可审计。确切了解你的 智能体 如何做决策、任务如何路由、数据流向何方。
        - generic [ref=e745]:
          - heading "社区驱动" [level=3] [ref=e746]
          - paragraph [ref=e747]: 与社区一起建设，而不仅仅是为社区建设。贡献技能、集成和 智能体 后端，让每个人受益。
    - generic [ref=e749]:
      - generic [ref=e750]:
        - paragraph [ref=e751]: 常见问题
        - heading "问与答。" [level=2] [ref=e752]
      - generic [ref=e753]:
        - generic [ref=e754]:
          - button "Multica 支持哪些编码 智能体？" [ref=e755]:
            - generic [ref=e756]: Multica 支持哪些编码 智能体？
            - img [ref=e758]
          - paragraph [ref=e760]: Multica 开箱即用支持 11 款 AI 编程工具：Claude Code、Codex、Cursor、Copilot、Gemini、Hermes、Kimi、Kiro CLI、OpenCode、OpenClaw、Pi。守护进程会自动检测本机已安装的 CLI 并为每款注册一个运行时。因为开源，你也可以自己添加后端。
        - generic [ref=e761]:
          - button "需要自托管吗，还是有云版本？" [ref=e762]:
            - generic [ref=e763]: 需要自托管吗，还是有云版本？
            - img [ref=e765]
          - paragraph [ref=e767]: 两者都有。你可以用 Docker Compose 或 Kubernetes 在自己的基础设施上自托管 Multica，也可以使用我们的托管云版本。你的数据，你选择。
        - generic [ref=e768]:
          - button "这和直接用编码 智能体 有什么区别？" [ref=e769]:
            - generic [ref=e770]: 这和直接用编码 智能体 有什么区别？
            - img [ref=e772]
          - paragraph [ref=e774]: 编码 智能体 擅长执行。Multica 添加的是管理层：任务队列、团队协作、技能复用、运行时监控，以及每个 智能体 在做什么的统一视图。把它想象成你的 智能体 的项目经理。
        - generic [ref=e775]:
          - button "智能体 能自主处理长时间任务吗？" [ref=e776]:
            - generic [ref=e777]: 智能体 能自主处理长时间任务吗？
            - img [ref=e779]
          - paragraph [ref=e781]: 可以。Multica 管理完整的任务生命周期——入队、领取、执行、完成或失败。智能体 主动报告阻塞并实时推送进度。你可以随时查看，也可以让它们运行整晚。
        - generic [ref=e782]:
          - button "我的代码安全吗？智能体 在哪里执行？" [ref=e783]:
            - generic [ref=e784]: 我的代码安全吗？智能体 在哪里执行？
            - img [ref=e786]
          - paragraph [ref=e788]: 智能体 在你的机器（本地守护进程）或你自己的云基础设施上执行。代码永远不会经过 Multica 服务器。平台只协调任务状态和广播事件。
        - generic [ref=e789]:
          - button "我可以运行多少个 智能体？" [ref=e790]:
            - generic [ref=e791]: 我可以运行多少个 智能体？
            - img [ref=e793]
          - paragraph [ref=e795]: 取决于你的硬件。每个 智能体 有可配置的并发限制，你可以连接多台机器作为运行时。开源版本没有任何人为限制。
